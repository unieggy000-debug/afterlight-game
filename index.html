variant-numeric:tabular-nums;font-size:10px}.under{max-width:740px;margin:13px auto 0;display:flex;justify-content:space-between;gap:20px;color:#9b9f92;font-size:9px;min-height:20px}.under .hint-msg{color:#957234}.coast{max-width:740px;margin:28px auto 0;display:flex;align-items:center;justify-content:center;gap:17px}.station{height:4px;width:28px;background:#d5d8cc;border-radius:1px;transition:background .6s}.station.on{background:#929f7e}.station.now{background:var(--gold)}footer{border-top:1px solid var(--rule);display:flex;justify-content:space-between;color:#a1a497;font-size:9px;padding-top:12px;margin-top:25px}.modal{position:fixed;inset:0;z-index:4;background:#f1efe7e8;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:25px;overflow:auto}.modal.hidden,.hidden{display:none!important}.sheet{width:min(620px,100%);padding:28px 0}.sheet .eyebrow{font-size:9px;color:#8e9586;letter-spacing:2px;text-transform:uppercase}.sheet h1,.sheet h2{font:400 46px/1.1 Georgia,serif;letter-spacing:-1.5px;margin:15px 0 18px}.sheet p{color:#7c8375;line-height:1.8;font-size:13px;max-width:540px}.sheet .row{display:flex;gap:22px;align-items:center;margin-top:25px;flex-wrap:wrap}.route-grid{display:grid;grid-template-columns:1fr 1fr;gap:35px;border-top:1px solid var(--rule);padding-top:24px;margin-top:26px}.route-choice{text-align:left;padding:0}.route-choice .route-art{display:block;font:35px/1 Georgia,serif;color:#808c75;margin-bottom:14px}.route-choice h3{font:400 24px Georgia,serif;margin:0 0 12px}.route-choice p{font-size:12px;line-height:1.7}.route-choice .arrow{font-size:17px;margin-top:17px;display:block;transition:transform .2s}.route-choice:hover .arrow{transform:translateX(8px)}.results{display:flex;gap:45px;border-block:1px solid var(--rule);padding:20px 0;margin:25px 0}.results small{display:block;font-size:9px;color:#989e8e;margin-bottom:7px}.results strong{font:400 32px Georgia,serif}.about{align-items:flex-start}.about .sheet{max-width:780px;width:100%;padding-top:20px}.about h1{font-size:48px}.about h2{font-size:24px;letter-spacing:-.5px;margin-top:30px}.about p,.about li{font-size:13px;color:#7b8273;line-height:1.8}.about li{padding:4px 0}.about .close{float:right;font-size:11px;border-bottom:1px solid #aaa;padding:4px 0}.about-cols{display:grid;grid-template-columns:1fr 1fr;gap:35px}.topics{font-size:10px;color:#7a826f;border-block:1px solid var(--rule);padding:12px 0;margin-top:18px;display:flex;gap:22px;flex-wrap:wrap}.credits{font-size:10px!important;color:#9a9e91!important}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;font-size:11px;z-index:7;border-radius:2px}.mode-pick{display:flex;border-bottom:1px solid var(--rule);width:max-content;gap:20px;margin:25px 0}.mode-pick button{font-size:11px;color:#a0a592;padding:8px 0;border-bottom:1px solid transparent;margin-bottom:-1px}.mode-pick button.active{color:var(--ink);border-color:var(--ink)}.co-op-note{font-size:10px;color:#7f8877;margin:10px auto 0;max-width:740px}.charge-track{fill:none;stroke-width:3;transition:stroke-dashoffset .1s}.endpoint{stroke-width:1.3}.game .readout{font-size:10px;color:#919887}.completion-ring{animation:ripple 1s ease-out}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes flow{to{stroke-dashoffset:-44}}@keyframes ripple{from{opacity:.7;transform:scale(.5)}to{opacity:0;transform:scale(2)}}@media(max-width:750px){.app{padding:20px}.home{min-height:calc(100vh - 130px);grid-template-columns:1fr;gap:0;padding-top:45px}.home h1{font-size:60px;max-width:400px}.home p{max-width:330px}.cover-art{max-width:390px;justify-self:center;margin:25px 0}.game{padding-top:22px}.chapter{font-size:24px}.story{font-size:10px}.chapter-head{margin-bottom:14px}.controls{gap:10px;flex-wrap:wrap}.tools{gap:18px}.under{font-size:8px}.about-cols{grid-template-columns:1fr;gap:0}.sheet h1,.sheet h2{font-size:36px}.about h2{font-size:24px}.nav{gap:17px}.nav button{font-size:10px}.logo{font-size:27px}.route-grid{gap:25px}.route-choice h3{font-size:22px}.coast{margin-top:25px;gap:12px}.station{width:24px}.results{gap:35px}.sheet p{font-size:12px}}@media(max-width:420px){.app{padding:16px}.nav{gap:12px}.nav button{font-size:9px}.chapter{font-size:22px}.chapter-index{font-size:8px}.source-button{padding:7px 9px}.tools{gap:14px}.power{padding:3px 7px}.route-grid{gap:20px}}@media(prefers-reduced-motion:reduce){.beam.flow{animation:none}.mirror-rotor{transition:none}.completion-ring{animation:none}}

<script>
// OPTICAL ENGINE. Directions are east, south, west, north.
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]],REFLECT=[[3,2,1,0],[1,0,3,2]];
const LEVELS=[
 {id:'harbour',name:'The harbour',story:'The storm is over. The harbour has not answered.',sources:[{x:0,y:5,d:0,c:0,name:'Harbour lamp'}],mirrors:[{x:3,y:5,o:1},{x:3,y:1,o:0}],nodes:[{id:'home',x:8,y:1,c:0,goal:true}],gates:[],walls:[{x:5,y:4},{x:6,y:4}],par:2},
 {id:'passage',name:'The passage',story:'Beyond the seawall, a second window is still dark.',sources:[{x:0,y:5,d:0,c:0,name:'Harbour lamp'}],mirrors:[{x:2,y:5,o:1},{x:2,y:2,o:1},{x:6,y:2,o:0},{x:6,y:5,o:0}],nodes:[{id:'home',x:8,y:5,c:0,goal:true}],gates:[],walls:[{x:4,y:5},{x:4,y:4},{x:4,y:1}],par:3},
 {id:'breakwater',name:'The breakwater',story:'The old shutter still works. Its relay needs a little light.',sources:[{x:0,y:3,d:0,c:0,name:'West lamp'}],mirrors:[{x:2,y:3,o:1},{x:2,y:1,o:0},{x:2,y:5,o:1},{x:6,y:5,o:0},{x:6,y:3,o:1}],nodes:[{id:'relay',x:6,y:1,c:0,goal:false},{id:'home',x:8,y:3,c:0,goal:true}],gates:[{x:4,y:5,key:'relay'}],walls:[{x:4,y:3},{x:4,y:4}],par:7},
 {id:'cliff',name:'The cliff line',story:'One lamp. Two paths. The cliff keeper is waiting at the far window.',sources:[{x:0,y:4,d:0,c:0,name:'West lamp'}],mirrors:[{x:2,y:4,o:1,split:true},{x:6,y:4,o:1},{x:2,y:1,o:0}],nodes:[{id:'relay',x:5,y:1,c:0,goal:false},{id:'home',x:6,y:0,c:0,goal:true}],gates:[{x:6,y:2,key:'relay'}],walls:[{x:4,y:2},{x:4,y:3}],par:3},
 {id:'farshore',name:'The far shore',story:'Two keepers share one line. Let the first signal hold before changing course.',sources:[{x:0,y:5,d:0,c:0,name:'West lamp'},{x:8,y:1,d:2,c:1,name:'East lamp'}],mirrors:[{x:2,y:5,o:1},{x:2,y:3,o:0},{x:4,y:3,o:1},{x:4,y:1,o:1},{x:6,y:1,o:1},{x:6,y:3,o:1},{x:1,y:1,o:0}],nodes:[{id:'amber',x:6,y:0,c:0,goal:true},{id:'blue',x:1,y:0,c:1,goal:true}],gates:[{x:3,y:1,key:'amber'}],walls:[{x:3,y:5},{x:5,y:5},{x:1,y:3}],par:10},
 {id:'lighthouse',name:'The lighthouse',story:'The last room is above the tide. Bring both signals home.',sources:[{x:0,y:5,d:0,c:0,name:'West lamp'},{x:8,y:1,d:2,c:1,name:'East lamp'}],mirrors:[{x:2,y:5,o:1,split:true},{x:2,y:1,o:0},{x:6,y:5,o:1},{x:6,y:3,o:1},{x:6,y:1,o:1},{x:4,y:3,o:1}],nodes:[{id:'relay',x:5,y:1,c:0,goal:false},{id:'amber',x:8,y:3,c:0,goal:true},{id:'blue',x:4,y:6,c:1,goal:true}],gates:[{x:4,y:5,key:'relay'}],walls:[{x:4,y:2},{x:3,y:3}],par:7}
];
function inletLevel(){const base=LEVELS[3];return {...base,id:'inlet',name:'The inlet line',story:'The inlet keeper answers. A second path must reach the shutter first.',sources:base.sources.map(s=>({...s,x:8-s.x,y:6-s.y,d:(s.d+2)%4,name:'East lamp'})),mirrors:base.mirrors.map(m=>({...m,x:8-m.x,y:6-m.y})),nodes:base.nodes.map(n=>({...n,x:8-n.x,y:6-n.y})),gates:base.gates.map(g=>({...g,x:8-g.x,y:6-g.y})),walls:base.walls.map(w=>({x:8-w.x,y:6-w.y}))};}
function bitFor(level,id){return 1<<level.nodes.findIndex(n=>n.id===id);}
function trace(level,mask,active,memory,powered=true){const rays=[],hits=new Set(),visited=new Set();if(!powered)return {rays,hits};const source=level.sources[active];if(!source)return {rays,hits};const queue=[{x:source.x,y:source.y,d:source.d,path:[[source.x,source.y]],energy:1}];let steps=0;
 while(queue.length&&steps<600){let beam=queue.shift(),{x,y,d,path,energy}=beam;for(let s=0;s<100;s++){steps++;const [dx,dy]=DIRS[d];x+=dx;y+=dy;path.push([x,y]);if(x<0||x>8||y<0||y>6)break;const key=x+','+y+','+d;if(visited.has(key))break;visited.add(key);if(level.walls.some(w=>w.x===x&&w.y===y))break;const gate=level.gates.find(g=>g.x===x&&g.y===y);if(gate&&!(memory&bitFor(level,gate.key)))break;const node=level.nodes.find(n=>n.x===x&&n.y===y);if(node){if(node.c===source.c)hits.add(node.id);break;}const other=level.sources.find((s,i)=>i!==active&&s.x===x&&s.y===y);if(other)break;const mi=level.mirrors.findIndex(m=>m.x===x&&m.y===y);if(mi>=0){const o=(mask>>mi)&1;if(level.mirrors[mi].split){queue.push({x,y,d:REFLECT[o][d],path:[[x,y]],energy:energy*.5});energy*=.5;}else d=REFLECT[o][d];}}
 rays.push({path,energy,c:source.c});}
 return {rays,hits};}
function settle(level,mask,active,memory){let next=memory;for(let i=0;i<=level.nodes.length;i++){const result=trace(level,mask,active,next);let after=next;for(const id of result.hits)after|=bitFor(level,id);if(after===next)break;next=after;}return next;}
function complete(level,memory){return level.nodes.filter(n=>n.goal).every(n=>memory&bitFor(level,n.id));}
function solve(level,mask,active,memory){const first={mask,active,memory:settle(level,mask,active,memory),path:[]},queue=[first],seen=new Set();let i=0;while(i<queue.length&&i<30000){const s=queue[i++],key=s.mask+'_'+s.active+'_'+s.memory;if(seen.has(key))continue;seen.add(key);if(complete(level,s.memory))return s.path;for(let m=0;m<level.mirrors.length;m++){const nextMask=s.mask^(1<<m);queue.push({mask:nextMask,active:s.active,memory:settle(level,nextMask,s.active,s.memory),path:[...s.path,{type:'mirror',index:m}]});}if(level.sources.length>1){const other=1-s.active;queue.push({mask:s.mask,active:other,memory:settle(level,s.mask,other,s.memory),path:[...s.path,{type:'source',index:other}]});}}return null;}
// INTERFACE
if(typeof document!=='undefined'){
const $=s=>document.querySelector(s),main=$('#main'),modal=$('#modal');let chapter=0,level=null,mask=0,active=0,memory=0,powered=true,moves=0,total=0,mode='solo',sound=false,audio=null,phase='home',route='cliff',results=[],charges={},lastTime=0,run=0,hinted=false,hintIndex=-1,toastTimer=null,best=0;
try{best=Number(localStorage.getItem('afterlight-best')||0);}catch{}
const colors=['#c4943c','#538c99'];
const point=([x,y])=>[(x+.5)*100,(y+.5)*100];
function announce(s){$('#live').textContent=s;}
function tone(f=400,len=.07){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+len);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+len);}catch{}}
function cover(){return `<svg viewBox="0 0 500 500" aria-label="A quiet beam of light turns through mirrors toward a coastal window" role="img"><path d="M40 440Q150 390 250 432T470 415" fill="none" stroke="#d4d7c8" stroke-width="1"/><path d="M0 458Q120 410 240 454T500 438" fill="none" stroke="#d4d7c8" stroke-width="1"/><path d="M30 350H150V115H355V285H460" fill="none" stroke="#d6a044" stroke-width="2"/><path d="M30 350H150V115H355V285H460" fill="none" stroke="#d6a044" stroke-width="15" opacity=".04"/><g stroke="#343f32" stroke-width="5" stroke-linecap="round"><path d="m130 370 40-40M130 95l40 40M335 95l40 40M335 305l40-40"/></g><circle cx="30" cy="350" r="5" fill="#d6a044"/><rect x="448" y="273" width="25" height="25" rx="2" fill="#d2dbbf" stroke="#8b997c"/><rect x="455" y="280" width="11" height="11" fill="#f7f2d5"/><path d="M405 455V365h40v90m-47-90 27-26 27 26" fill="none" stroke="#c7cebb" stroke-width="1.2"/><circle cx="425" cy="322" r="1.5" fill="#afbe9b"/></svg>`;}
function home(){phase='home';level=null;modal.classList.add('hidden');$('#footer-right').textContent='A coast waiting for a signal.';main.innerHTML=`<section class="home"><div><h1>A coast<br>without lights.</h1><p>The storm has passed.<br>Six stations are still waiting to hear from each other.</p><button class="linkbtn" id="begin">Restore the first signal <span>↗</span></button><div class="small-note">Six small puzzles. No clock.</div></div><div class="cover-art">${cover()}</div></section>`;$('#begin').onclick=()=>{chapter=0;total=0;results=[];route='cliff';loadLevel();};}
function loadLevel(){modal.classList.add('hidden');phase='playing';level=chapter===3&&route==='inlet'?inletLevel():LEVELS[chapter];mask=level.mirrors.reduce((s,m,i)=>s|(m.o<<i),0);active=0;memory=0;charges={};moves=0;powered=true;hinted=false;hintIndex=-1;renderBoard();announce(level.name+'. Rotate mirrors to restore the signal.');}
function coast(){return `<div class="coast" aria-label="Coast restoration progress">${LEVELS.map((_,i)=>`<span class="station ${i<chapter?'on':i===chapter?'now':''}" title="Station ${i+1}"></span>`).join('')}</div>`;}
function renderBoard(){main.innerHTML=`<section class="game"><div class="chapter-head"><div><h1 class="chapter">${level.name}</h1><p class="story">${level.story}</p></div><span class="chapter-index">0${chapter+1} / 06</span></div><div class="board-wrap"><svg id="board" viewBox="0 0 900 700" role="group" aria-label="Light routing puzzle board"><defs><clipPath id="boardClip"><rect x="0" y="0" width="900" height="700"/></clipPath></defs><rect class="board-wash" width="900" height="700"/><g aria-hidden="true">${Array.from({length:63},(_,i)=>{const x=(i%9+.5)*100,y=(Math.floor(i/9)+.5)*100;return `<path class="cross" d="M${x-3} ${y}h6M${x} ${y-3}v6"/>`;}).join('')}</g><g id="ray-layer" clip-path="url(#boardClip)" aria-hidden="true"></g><g>${level.walls.map(w=>{const[x,y]=point([w.x,w.y]);return `<rect x="${x-29}" y="${y-29}" width="58" height="58" rx="3" fill="#d8dbce"/><path d="M${x-20} ${y+18}l38-38M${x-18} ${y-18}l36 36" stroke="#cad0c0" stroke-width="1"/>`;}).join('')}</g><g id="gate-layer">${level.gates.map((g,i)=>{const[x,y]=point([g.x,g.y]);return `<g id="gate-${i}" class="shutter" aria-label="Shutter controlled by ${g.key}"><rect x="${x-32}" y="${y-32}" width="64" height="64" rx="2" fill="#a8b29c"/><path d="M${x-24} ${y-18}h48M${x-24} ${y-6}h48M${x-24} ${y+6}h48M${x-24} ${y+18}h48" stroke="#e2e5d8" stroke-width="2"/><path d="M${x} ${y-7}l7 7-7 7-7-7z" fill="#eee9cd"/></g>`;}).join('')}</g><g>${level.sources.map((s,i)=>{const[x,y]=point([s.x,s.y]);return `<g id="emitter-${i}" transform="translate(${x} ${y})" role="button" tabindex="0" aria-label="Use ${s.name}"><circle r="22" fill="#e4e5d9" stroke="#bdc5b2"/><g transform="rotate(${s.d*90})"><path d="M-7-10 11 0-7 10Z" fill="${colors[s.c]}"/></g><text y="39" text-anchor="middle" class="mirror-key">${i+1}</text></g>`;}).join('')}</g><g>${level.nodes.map((n,i)=>{const[x,y]=point([n.x,n.y]);return `<g id="node-${i}" transform="translate(${x} ${y})" aria-label="${n.goal?(n.c===0?'Amber receiver':'Blue receiver'):'Relay'}"><circle class="halo" r="44" fill="${colors[n.c]}" opacity=".09"/>${n.goal?`<rect class="endpoint" x="-25" y="-25" width="50" height="50" rx="3" fill="#e3e5d8" stroke="${colors[n.c]}"/><rect class="receiver-core" x="-12" y="-12" width="24" height="24" fill="#ccd1c0"/>`:`<path class="endpoint" d="M0-27 27 0 0 27-27 0Z" fill="#e1e5d5" stroke="${colors[n.c]}"/><path class="receiver-core" d="M0-12 12 0 0 12-12 0Z" fill="#c8cfbb"/>`}<circle class="charge-track" id="charge-${i}" r="34" stroke="${colors[n.c]}" stroke-dasharray="213.63" stroke-dashoffset="213.63" transform="rotate(-90)"/></g>`;}).join('')}</g><g>${level.mirrors.map((m,i)=>{const[x,y]=point([m.x,m.y]);return `<g class="mirror" id="mirror-${i}" transform="translate(${x} ${y})" role="button" tabindex="0" aria-label="${m.split?'Beam splitter':'Mirror'} ${String.fromCharCode(65+i)}"><circle class="handle" r="31"/><g class="mirror-rotor" id="rotor-${i}" style="transform:rotate(${(mask>>i)&1?45:-45}deg)"><path class="${m.split?'split-line':'mirror-line'}" d="M-26 0H26"/>${m.split?'':'<path class="mirror-edge" d="M-24-3H24"/>'}</g><text class="mirror-key" y="49" text-anchor="middle">${String.fromCharCode(65+i)}</text></g>`;}).join('')}</g></svg></div><div class="controls"><div class="sources">${level.sources.map((s,i)=>`<button class="source-button ${i?'blue':''} ${i===active?'active':''}" data-source="${i}" aria-pressed="${i===active}"><span class="dot"></span>${level.sources.length===1?'Lamp':i===0?'West':'East'}</button>`).join('')}<button class="power" id="power">Light on</button></div><div class="tools"><span class="moves" id="move-count">0 turns</span><button id="undo">Undo</button><button id="reset">Reset</button><button id="hint">Hint</button></div></div><div class="under"><span id="instruction">${chapter===0?'Click a mirror to turn it.':chapter===2?'A diamond holds its signal. The matching shutter will stay open.':chapter===3?'The dashed mirror lets light pass through, too.':chapter===4?'Let one window fill. Then change the lamp and the shared mirrors.':'Both windows need a signal.'}</span><span class="hint-msg" id="hint-msg"></span></div><div id="coop-note" class="co-op-note ${mode==='solo'?'hidden':''}">Mirror keeper: click / A–G &nbsp; · &nbsp; Light keeper: 1 / 2 lamps, L power</div>${coast()}</section>`;
level.mirrors.forEach((m,i)=>{const el=$('#mirror-'+i);el.onclick=()=>rotate(i);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();rotate(i);}};});level.sources.forEach((s,i)=>{const el=$('#emitter-'+i);el.onclick=()=>selectSource(i);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectSource(i);}};});main.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>selectSource(+b.dataset.source));$('#power').onclick=togglePower;$('#reset').onclick=()=>{history=[];loadLevel();};$('#hint').onclick=hint;$('#undo').onclick=undo;history=[];update();}
let history=[];
function remember(){history.push({mask,active,memory,moves,powered});if(history.length>50)history.shift();}
function rotate(i){if(phase!=='playing')return;remember();mask^=1<<i;moves++;hintIndex=-1;$('#hint-msg').textContent='';tone(350+i*25,.045);update();}
function selectSource(i){if(phase!=='playing'||i===active)return;remember();active=i;powered=true;hintIndex=-1;tone(i?380:300);update();}
function togglePower(){if(phase!=='playing')return;remember();powered=!powered;update();}
function undo(){if(phase!=='playing'||!history.length)return;const s=history.pop();mask=s.mask;active=s.active;memory=s.memory;moves=s.moves;powered=s.powered;charges={};hintIndex=-1;update();}
function update(){if(!level)return;const result=trace(level,mask,active,memory,powered);$('#ray-layer').innerHTML=result.rays.map(r=>{const pts=r.path.map(p=>point(p).join(',')).join(' '),c=colors[r.c];return `<polyline class="beam" points="${pts}" stroke="${c}" stroke-width="15" opacity="${.045*r.energy}"/><polyline class="beam" points="${pts}" stroke="${c}" stroke-width="2.5" opacity="${.65+.35*r.energy}"/><polyline class="beam flow" points="${pts}" stroke="#fffdf1" stroke-width="2.2" opacity=".7"/>`;}).join('');level.mirrors.forEach((m,i)=>{$('#rotor-'+i).style.transform=`rotate(${(mask>>i)&1?45:-45}deg)`;$('#mirror-'+i).classList.toggle('hint',i===hintIndex);$('#mirror-'+i).setAttribute('aria-label',`${m.split?'Beam splitter':'Mirror'} ${String.fromCharCode(65+i)}, ${((mask>>i)&1)?'backslash':'slash'}`);});level.nodes.forEach((n,i)=>{const lit=!!(memory&bitFor(level,n.id));$('#node-'+i).classList.toggle('lit',lit);$('#node-'+i+' .receiver-core').style.fill=lit?colors[n.c]:'#c8cfbb';$('#node-'+i).setAttribute('aria-label',`${n.goal?(n.c===0?'Amber receiver':'Blue receiver'):'Relay'}, ${lit?'charged':'unlit'}`);});level.gates.forEach((g,i)=>{$('#gate-'+i).style.opacity=memory&bitFor(level,g.key)?'.12':'1';});main.querySelectorAll('[data-source]').forEach(b=>{b.classList.toggle('active',+b.dataset.source===active);b.setAttribute('aria-pressed',+b.dataset.source===active);});level.sources.forEach((s,i)=>{$('#emitter-'+i).style.opacity=i===active&&powered?'1':'.4';});$('#power').textContent=powered?'Light on':'Light off';$('#move-count').textContent=moves+(moves===1?' turn':' turns');$('#footer-right').textContent=String(total).padStart(4,'0')+' points';}
function hint(){if(phase!=='playing')return;hinted=true;if(!powered){$('#hint-msg').textContent='Turn the light on.';return;}const current=trace(level,mask,active,memory);if([...current.hits].some(id=>!(memory&bitFor(level,id)))){$('#hint-msg').textContent='Hold this path for a moment.';return;}const plan=solve(level,mask,active,memory);if(!plan||!plan.length){$('#hint-msg').textContent='Let the signal settle.';return;}const next=plan[0];if(next.type==='mirror'){hintIndex=next.index;$('#hint-msg').textContent='Try mirror '+String.fromCharCode(65+next.index)+'.';}else $('#hint-msg').textContent='Try the '+(next.index?'East':'West')+' lamp.';update();announce($('#hint-msg').textContent);}
function tick(t){const dt=Math.min((t-lastTime)/1000||.016,.08);lastTime=t;if(phase==='playing'&&level&&modal.classList.contains('hidden')&&!document.hidden&&$('#about').classList.contains('hidden')){const result=trace(level,mask,active,memory,powered);let changed=false;for(let i=0;i<level.nodes.length;i++){const n=level.nodes[i],bit=bitFor(level,n.id);if(memory&bit){$('#charge-'+i).style.strokeDashoffset='0';continue;}charges[n.id]=result.hits.has(n.id)?(charges[n.id]||0)+dt:0;$('#charge-'+i).style.strokeDashoffset=String(213.63*(1-Math.min(charges[n.id]/.7,1)));if(charges[n.id]>=.7){memory|=bit;changed=true;tone(n.goal?660:480,.22);announce((n.goal?'Window':'Relay')+' charged.');}}if(changed){update();if(complete(level,memory))finishLevel();}}run=requestAnimationFrame(tick);}
function show(html){modal.innerHTML=html;modal.classList.remove('hidden');}
function finishLevel(){phase='complete';const points=Math.max(200,1000-moves*35)+(hinted?0:100);total+=points;results.push({name:level.name,moves,points});show(`<section class="sheet"><div class="eyebrow">Signal 0${chapter+1} restored</div><h1>${chapter===5?'The coast answers.':'A light in the distance.'}</h1><p>${chapter===0?'The harbour keeper sends a short reply. There are others further along the coast.':chapter===1?'A second keeper answers. The line to the breakwater is still silent.':chapter===2?'The shutter opens. Two lines lead out of the breakwater. Choose which keeper to call first.':chapter===3?'The keeper answers, and passes your signal to the far shore.':chapter===4?'Both keepers answer. Only the lighthouse is still dark.':'One by one, the small windows along the shore return to the night.'}</p><div class="results"><div><small>Mirror turns</small><strong>${moves}</strong></div><div><small>Signal points</small><strong>+${points}</strong></div></div><button class="linkbtn" id="next">${chapter===2?'Choose a line':chapter===5?'Read the coast log':'Continue along the coast'} <span>↗</span></button></section>`);$('#next').onclick=()=>{if(chapter===2)chooseRoute();else if(chapter===5)ending();else{chapter++;loadLevel();}};announce(level.name+' signal restored.');}
function chooseRoute(){phase='route';show(`<section class="sheet"><div class="eyebrow">Beyond the breakwater</div><h1>Which line first?</h1><p>The other keeper will hear through the restored line. Both routes reach the lighthouse.</p><div class="route-grid"><button class="route-choice" id="cliff"><span class="route-art">╱</span><h3>The cliff line</h3><p>Above the harbour, a keeper waits behind an old shutter.</p><span class="arrow">↗</span></button><button class="route-choice" id="inlet"><span class="route-art">⌁</span><h3>The inlet line</h3><p>Across the water, the relay faces back toward the coast.</p><span class="arrow">↗</span></button></div></section>`);$('#cliff').onclick=()=>{route='cliff';chapter++;loadLevel();};$('#inlet').onclick=()=>{route='inlet';chapter++;loadLevel();};}
function ending(){phase='ending';if(total>best){best=total;try{localStorage.setItem('afterlight-best',String(best));}catch{}}show(`<section class="sheet"><div class="eyebrow">Six stations / One coast</div><h1>Nothing left<br>in the dark.</h1><p>${route==='cliff'?'The cliff keeper passes the last message down to the inlet.':'The inlet keeper passes the last message up to the cliff.'} The lighthouse answers. For tonight, the coast is connected again.</p><div class="results"><div><small>Signal points</small><strong>${total}</strong></div><div><small>Total turns</small><strong>${results.reduce((s,r)=>s+r.moves,0)}</strong></div><div><small>Best on this device</small><strong>${best}</strong></div></div><div class="row"><button class="primary" id="again">Begin again <span>↻</span></button><button class="linkbtn" id="ending-about">About the game <span>↗</span></button></div></section>`);$('#again').onclick=()=>{chapter=0;total=0;results=[];loadLevel();};$('#ending-about').onclick=openAbout;$('#footer-right').textContent=total+' points';}
function openAbout(){$('#about').classList.remove('hidden');$('#about').innerHTML=`<article class="sheet"><button class="close" id="close-about">Back to the coast ×</button><div class="eyebrow">About the game</div><h1>Afterlight</h1><p>Restore the quiet signals of a storm-darkened coast. Turn mirrors, open relay-controlled shutters, and guide two lamps through shared paths. Each restored window changes what is possible, bringing the lighthouse and its keepers back into contact.</p><div class="topics"><span>Topic: Geometrical optics</span><span>Science · Physics</span><span>Engineering · Optical signalling</span></div><h2>Learning objectives</h2><ol><li>Predict a light ray’s path after reflection from a plane mirror, using equal angles of incidence and reflection.</li><li>Distinguish a mirror’s reflected path from the reflected and transmitted paths of an ideal beam splitter.</li><li>Plan and revise a sequence of optical paths when receivers and relay-controlled shutters change the available routes.</li></ol><div class="about-cols"><section><h2>Mechanics</h2><p>Restore all six coastal stations. Click a mirror to rotate it by 90°. A solid bar reflects light; a dashed bar reflects part and transmits part. Guide a lamp into each matching receiver long enough for it to charge.</p><p>Diamond relays and square receivers store their charge. A relay opens its matching shutter. Only one lamp is powered at a time. Use the lamp buttons, 1/2, or L to switch power. A–G rotate matching mirrors; Enter/Space work on a focused mirror.</p><p>There is no timer or loss of lives. Undo and Reset are available. Fewer mirror turns earn more points, with a bonus for a signal restored without hints. Restored stations unlock the route onward.</p></section><section><h2>Dynamics</h2><p>Charging a relay changes the board: a blocked route becomes available. Later, two lamps share mirrors, so a path that serves one receiver may have to be dismantled to serve the other. Stored signals preserve progress while the optical route changes.</p><p>In <b>Two keepers</b>, one player operates mirrors while the other selects and powers the lamps. The light keeper must leave a path powered long enough to charge before the mirror keeper redirects it. Players share one device; no online connection is required.</p></section></div><h2>Aesthetics and story</h2><p>A restrained palette, fine moving light, quiet mechanical sounds and a gradually restored coast keep attention on the path. You choose the cliff or inlet line before the shared-signal puzzles. There are no quizzes or teaching cards on the board.</p><h2>Science and learning design</h2><p>For an ideal plane mirror, the angle of incidence equals the angle of reflection, both measured from the normal. Our grid restricts rays to horizontal/vertical directions and mirror surfaces to ±45°. The dashed component models an ideal, symmetric partial reflector: one ray is reflected and another transmitted.</p><p>The first stations isolate simple reflection. Later stations add relays, splitting and shared paths. Immediate optical feedback supports prediction, observation and revision. Charge-storage relays are an engineering abstraction; real receivers need electrical circuits to store a signal. Charging time is a gameplay device, not the travel time of light.</p><p class="credits">Reference: <a href="https://openstax.org/books/college-physics/pages/25-2-the-law-of-reflection" target="_blank" rel="noopener">OpenStax, The Law of Reflection</a>. The model omits diffraction, interference, loss and polarization. Its split branches are assumed bright enough to activate a receiver.</p><p class="credits">Original levels, story, interface and procedural artwork created for ZhouYuan with AI assistance. This uses general optical-puzzle mechanics; no commercial game’s levels, art or story were copied. No analytics, external assets, downloads or accounts. Best score is stored only on this device.</p><div class="row"><button class="linkbtn" id="close-bottom">Back to the coast <span>↗</span></button></div></article>`;$('#close-about').onclick=$('#close-bottom').onclick=()=>$('#about').classList.add('hidden');}
$('#about-button').onclick=openAbout;$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'Sound on':'Sound off';tone(440);};$('#mode-label').onclick=()=>{mode=mode==='solo'?'coop':'solo';$('#mode-label').textContent=mode==='solo'?'One keeper':'Two keepers';if($('#coop-note'))$('#coop-note').classList.toggle('hidden',mode==='solo');announce(mode==='solo'?'One keeper mode.':'Two keepers. One operates mirrors; the other operates light.');};$('#logo').onclick=()=>{if(phase==='home')return;show(`<section class="sheet"><h2>Leave this signal?</h2><p>A new coast begins from the harbour. Your best score stays on this device.</p><div class="row"><button class="primary" id="home-confirm">Return to the harbour</button><button class="linkbtn" id="home-cancel">Stay here <span>↗</span></button></div></section>`);$('#home-confirm').onclick=home;$('#home-cancel').onclick=()=>modal.classList.add('hidden');};
window.addEventListener('keydown',e=>{if(!$('#about').classList.contains('hidden')){if(e.key==='Escape')$('#about').classList.add('hidden');return;}if(phase!=='playing'||!modal.classList.contains('hidden'))return;if(e.repeat)return;const k=e.key.toLowerCase();if(k>='a'&&k<='g'){const i=k.charCodeAt(0)-97;if(i<level.mirrors.length)rotate(i);}if(k==='1')selectSource(0);if(k==='2'&&level.sources.length>1)selectSource(1);if(k==='l')togglePower();if(k==='z')undo();});
home();run=requestAnimationFrame(tick);
}
</script></body></html>
